name: EnvSensor
options:
  bundleIdPrefix: com.liesegang
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.2"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEVELOPMENT_TEAM: ""
targets:
  EnvSensor:
    type: application
    platform: iOS
    sources:
      - path: EnvSensor
    settings:
      base:
        DEVELOPMENT_TEAM: T348C8J368
        PRODUCT_BUNDLE_IDENTIFIER: com.liesegang.envsensor
        PRODUCT_NAME: EnvSensor
        INFOPLIST_FILE: EnvSensor/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - sdk: libsqlite3.tbd
schemes:
  EnvSensor:
    build:
      targets:
        EnvSensor: all
    run:
      config: Debug
