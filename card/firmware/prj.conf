CONFIG_GPIO=y
CONFIG_PWM=y
CONFIG_PM_DEVICE=y
CONFIG_PM_DEVICE_RUNTIME=y
# Keep the application in System ON; only short RTOS scheduling waits remain.
CONFIG_PM=n
CONFIG_POWEROFF=n
CONFIG_I2C=y
CONFIG_I2C_NRFX_TRANSFER_TIMEOUT=100
CONFIG_SPI=y
CONFIG_CPP=y
CONFIG_STD_CPP11=y
CONFIG_PICOLIBC_IO_FLOAT=y
CONFIG_DISK_DRIVER_SDMMC=y
CONFIG_FILE_SYSTEM=y
CONFIG_FAT_FILESYSTEM_ELM=y
# Never format an existing or unrecognized card while mounting it.
CONFIG_FS_FATFS_MOUNT_MKFS=n
CONFIG_FS_FATFS_MKFS=n

# The card has no UART console; use the connected SWD probe.
CONFIG_CONSOLE=y
CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y
CONFIG_UART_CONSOLE=n
CONFIG_SERIAL=n
CONFIG_PRINTK=y
CONFIG_SEGGER_RTT_MODE_NO_BLOCK_SKIP=y
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=8192
# Firmware updates can move RTT buffers; reset retained control-block pointers.
CONFIG_SEGGER_RTT_INIT_MODE_ALWAYS=y

CONFIG_MAIN_STACK_SIZE=4096
CONFIG_BUILD_OUTPUT_HEX=y
CONFIG_NRF_APPROTECT_DISABLE=y

CONFIG_CARD_TEST_CADENCE=n
CONFIG_CARD_ALARM_TEST_ON_BOOT=n
CONFIG_CARD_SWITCH_POLL_MS=50
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="Card Sensor"
CONFIG_BT_MAX_CONN=1
CONFIG_BT_SMP=y
CONFIG_BT_SMP_SC_ONLY=y
CONFIG_BT_SMP_APP_PAIRING_ACCEPT=y
CONFIG_BT_APP_PASSKEY=y
CONFIG_BT_BONDABLE=y
CONFIG_BT_BONDING_REQUIRED=y
CONFIG_BT_MAX_PAIRED=1
CONFIG_BT_SETTINGS=y
CONFIG_BT_GATT_SERVICE_CHANGED=y
CONFIG_BT_GATT_CACHING=y
# Save CCC as the link disconnects, without an extra periodic delayed write.
CONFIG_BT_SETTINGS_CCC_STORE_ON_WRITE=n
CONFIG_BT_SETTINGS_CF_STORE_ON_WRITE=n
CONFIG_ENV_TELEMETRY_SECURE=y
# Internal RRAM key storage; do not put secrets in the removable SD filesystem.
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_USE_DT_CODE_PARTITION=y
CONFIG_SETTINGS=y
CONFIG_ZMS=y
CONFIG_SETTINGS_ZMS=y
CONFIG_ZMS_NO_DOUBLE_WRITE=y
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_BUF_ACL_TX_SIZE=251
# Release the controller and its LFRC calibration timer between minute windows.
CONFIG_DYNAMIC_INTERRUPTS=y
CONFIG_DYNAMIC_DIRECT_INTERRUPTS=y
CONFIG_MPSL_DYNAMIC_INTERRUPTS=y
CONFIG_BT_UNINIT_MPSL_ON_DISABLE=y
# Transfer every 1-Hz record in short connections (15--30 ms, no latency).
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=12
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=24
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=600
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC_CALIBRATION=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_500PPM=y
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=3072
