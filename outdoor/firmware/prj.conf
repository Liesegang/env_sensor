CONFIG_PWM=y
CONFIG_I2C=y
CONFIG_I2C_NRFX_TRANSFER_TIMEOUT=100
CONFIG_APP_I2C_SCAN=y
CONFIG_APP_SENSOR_READ=y
CONFIG_APP_BLE=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC_CALIBRATION=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_500PPM=y
CONFIG_BT_DEVICE_NAME="Outdoor Sensor"
CONFIG_BT_MAX_CONN=1
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=12
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=24
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=400
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=3072
CONFIG_APP_BUZZER_TEST=n
# Optional sensors: BMV080 and AS3935 remain disabled; SFA40 is connected.
CONFIG_APP_BMV080=n
CONFIG_APP_AS3935=n
CONFIG_APP_SFA40=y

# No spare UART connection on this board: console runs over SWD/RTT.
CONFIG_CONSOLE=y
CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y
CONFIG_UART_CONSOLE=n
CONFIG_SERIAL=n
CONFIG_PRINTK=y
CONFIG_SEGGER_RTT_MODE_NO_BLOCK_SKIP=y
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=8192

CONFIG_MAIN_STACK_SIZE=4096
CONFIG_ASSERT=y
CONFIG_BUILD_OUTPUT_HEX=y
CONFIG_NRF_APPROTECT_DISABLE=y

CONFIG_BUZZER_FREQUENCY_HZ=2000
CONFIG_BUZZER_DUTY_PERMILLE=500

CONFIG_APP_SD_LOG=y
# Mount only existing FAT media: never format a user's card automatically.
CONFIG_FS_FATFS_MOUNT_MKFS=n
CONFIG_FS_FATFS_MKFS=n
CONFIG_FS_FATFS_HAS_RTC=y
CONFIG_FS_FATFS_NUM_FILES=1
CONFIG_FS_FATFS_NUM_DIRS=1

